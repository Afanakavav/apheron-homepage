<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Icone PWA - APHERON</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0A0A0A;
            color: #E0E0E0;
        }
        h1 {
            color: #D4AF37;
        }
        .upload-area {
            border: 2px dashed #D4AF37;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: #1A1A1A;
        }
        input[type="file"] {
            display: none;
        }
        label {
            display: inline-block;
            padding: 12px 24px;
            background: #D4AF37;
            color: #0A0A0A;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        label:hover {
            background: #B8941F;
            transform: translateY(-2px);
        }
        button {
            padding: 12px 24px;
            background: #D4AF37;
            color: #0A0A0A;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #B8941F;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .preview-item {
            text-align: center;
            padding: 15px;
            background: #1A1A1A;
            border-radius: 8px;
        }
        .preview-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #D4AF37;
        }
        .preview-item h3 {
            margin: 10px 0 5px;
            color: #D4AF37;
        }
        .download-links {
            margin-top: 30px;
        }
        .download-links a {
            display: inline-block;
            margin: 5px;
            padding: 8px 16px;
            background: #2A2A2A;
            color: #D4AF37;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #D4AF37;
        }
        .download-links a:hover {
            background: #D4AF37;
            color: #0A0A0A;
        }
        .info {
            background: #1A1A1A;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #D4AF37;
        }
    </style>
</head>
<body>
    <h1>🎨 Generatore Icone PWA per APHERON</h1>
    
    <div class="info">
        <strong>📋 Istruzioni:</strong>
        <ol>
            <li>Carica il logo (PNG, SVG, o JPG) - dimensione minima consigliata: 512x512px</li>
            <li>Clicca "Genera Icone" per creare le versioni nelle dimensioni richieste</li>
            <li>Scarica le icone generate e sostituisci i file esistenti in <code>public/</code></li>
        </ol>
    </div>

    <div class="upload-area">
        <label for="fileInput">📁 Seleziona il Logo</label>
        <input type="file" id="fileInput" accept="image/*">
        <p id="fileName" style="margin-top: 15px; opacity: 0.7;"></p>
    </div>

    <div style="text-align: center;">
        <button id="generateBtn" onclick="generateIcons()" disabled>✨ Genera Icone</button>
        <button onclick="clearAll()">🗑️ Reset</button>
    </div>

    <div id="preview" class="preview" style="display: none;"></div>
    <div id="downloadLinks" class="download-links" style="display: none;"></div>

    <script>
        let sourceImage = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = `File selezionato: ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(event) {
                    sourceImage = new Image();
                    sourceImage.onload = function() {
                        document.getElementById('generateBtn').disabled = false;
                    };
                    sourceImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function generateIcons() {
            if (!sourceImage) {
                alert('Per favore, carica prima un\'immagine!');
                return;
            }

            const sizes = [
                { name: 'icon-192.png', size: 192 },
                { name: 'icon-512.png', size: 512 },
                { name: 'apple-touch-icon.png', size: 180 }
            ];

            const previewDiv = document.getElementById('preview');
            const downloadDiv = document.getElementById('downloadLinks');
            previewDiv.innerHTML = '';
            downloadDiv.innerHTML = '';
            previewDiv.style.display = 'grid';
            downloadDiv.style.display = 'block';

            sizes.forEach(({ name, size }) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Disegna l'immagine centrata e scalata
                const scale = Math.min(size / sourceImage.width, size / sourceImage.height);
                const x = (size - sourceImage.width * scale) / 2;
                const y = (size - sourceImage.height * scale) / 2;
                const w = sourceImage.width * scale;
                const h = sourceImage.height * scale;

                ctx.drawImage(sourceImage, x, y, w, h);

                // Crea preview
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <h3>${name}</h3>
                    <img src="${canvas.toDataURL('image/png')}" alt="${name}">
                    <p>${size}x${size}px</p>
                `;
                previewDiv.appendChild(previewItem);

                // Crea link download
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = name;
                    link.textContent = `⬇️ Scarica ${name}`;
                    link.className = 'download-link';
                    downloadDiv.appendChild(link);
                }, 'image/png');
            });
        }

        function clearAll() {
            document.getElementById('fileInput').value = '';
            document.getElementById('fileName').textContent = '';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('downloadLinks').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;
            sourceImage = null;
        }
    </script>
</body>
</html>
