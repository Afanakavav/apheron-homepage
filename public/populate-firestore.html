<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populate Firestore - APHERON</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0A0A0A;
            color: #D4AF37;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #D4AF37; }
        button {
            background: #D4AF37;
            color: #0A0A0A;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin: 1rem 0.5rem 1rem 0;
        }
        button:hover { opacity: 0.8; }
        #output {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
            border: 1px solid #333;
        }
        .success { color: #4CAF50; }
        .error { color: #ff6b6b; }
        .info { color: #B8B8B8; }
    </style>
</head>
<body>
    <h1>🔥 APHERON Firestore Setup</h1>
    <p class="info">This page will populate your Firestore database with the initial 4 projects.</p>
    <p class="info"><strong>Use this only ONCE to setup your database!</strong></p>
    
    <button id="populate-btn">Populate Database with Projects</button>
    <button id="clear-btn" style="background: #ff6b6b;">Clear All Projects (Danger!)</button>
    
    <div id="output">
        <p class="info">Click "Populate Database" to add the 4 projects to Firestore...</p>
    </div>

    <script type="module">
        import { db, collection, addDoc, getDocs, deleteDoc, doc } from './firebase-config.js';
        
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            output.appendChild(p);
        }
        
        // Initial projects data
        const initialProjects = [
            {
                title: 'Italian Lessons Dublin',
                description: 'Platform for teaching Italian in Dublin',
                url: 'https://afanakavav.github.io/italian-lessons-dublin/',
                icon: '🇮🇹',
                iconClass: 'italian-flag',
                status: 'active',
                order: 1
            },
            {
                title: 'Wedding Platform',
                description: 'Complete platform for wedding management',
                url: 'https://afanakavav.github.io/matrimonio-andrea-giulia/',
                icon: '💒',
                iconClass: '',
                status: 'active',
                order: 2
            },
            {
                title: 'AI Consulting',
                description: 'Strategic consulting and AI training',
                url: 'https://afanakavav.github.io/apheron-homepage/consulting',
                icon: '🔮',
                iconClass: '',
                status: 'coming-soon',
                order: 3
            },
            {
                title: 'Portfolio',
                description: 'Collection of projects and skills',
                url: 'https://afanakavav.github.io/apheron-homepage/portfolio',
                icon: '⚡',
                iconClass: '',
                status: 'coming-soon',
                order: 4
            }
        ];
        
        // Populate Database
        document.getElementById('populate-btn').addEventListener('click', async () => {
            output.innerHTML = '';
            log('Starting population...', 'info');
            
            try {
                // Check if projects already exist
                const querySnapshot = await getDocs(collection(db, 'projects'));
                if (!querySnapshot.empty) {
                    if (!confirm(`Database already contains ${querySnapshot.size} project(s).\n\nDo you want to add these 4 projects anyway?\n\n(They will be added as duplicates)`)) {
                        log('Population cancelled.', 'info');
                        return;
                    }
                }
                
                log(`Adding ${initialProjects.length} projects...`, 'info');
                
                for (const project of initialProjects) {
                    const docRef = await addDoc(collection(db, 'projects'), project);
                    log(`✓ Added: ${project.title} (ID: ${docRef.id})`, 'success');
                }
                
                log(`\n🎉 Success! All ${initialProjects.length} projects added to Firestore!`, 'success');
                log('\nYou can now close this page and go to admin.html', 'info');
                
            } catch (error) {
                log(`\n❌ Error: ${error.message}`, 'error');
                console.error('Error adding projects:', error);
            }
        });
        
        // Clear All Projects (Danger!)
        document.getElementById('clear-btn').addEventListener('click', async () => {
            if (!confirm('⚠️ WARNING!\n\nThis will DELETE ALL projects from the database.\n\nAre you ABSOLUTELY sure?')) {
                return;
            }
            
            if (!confirm('This action CANNOT be undone!\n\nType YES to confirm you want to delete all projects.') || 
                !prompt('Type DELETE to confirm:')?.toUpperCase().includes('DELETE')) {
                log('Deletion cancelled.', 'info');
                return;
            }
            
            output.innerHTML = '';
            log('Deleting all projects...', 'info');
            
            try {
                const querySnapshot = await getDocs(collection(db, 'projects'));
                
                if (querySnapshot.empty) {
                    log('No projects to delete.', 'info');
                    return;
                }
                
                let deleted = 0;
                for (const docSnap of querySnapshot.docs) {
                    await deleteDoc(doc(db, 'projects', docSnap.id));
                    deleted++;
                    log(`Deleted: ${docSnap.data().title}`, 'info');
                }
                
                log(`\n✓ Successfully deleted ${deleted} project(s).`, 'success');
                
            } catch (error) {
                log(`\n❌ Error: ${error.message}`, 'error');
                console.error('Error deleting projects:', error);
            }
        });
    </script>
</body>
</html>
